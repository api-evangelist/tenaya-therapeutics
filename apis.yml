description: 'Tenaya Therapeutics is a clinical-stage biotechnology company headquartered
  in South San Francisco, California, focused on discovering, designing, developing,
  and delivering potentially curative gene therapies and precision medicines that
  address the underlying drivers of heart disease. Its clinical pipeline includes TN-201,
  an AAV-based gene therapy for MYBPC3-associated hypertrophic cardiomyopathy (HCM),
  and TN-401 for PKP2-associated arrhythmogenic right ventricular cardiomyopathy (ARVC),
  both in early clinical development. Publicly traded on Nasdaq as TNYA and backed
  by investors including GV, the company operates as a therapeutics developer and publishes
  no public developer platform or API surface.'
